name: Daily PE Multiples Monitor

# Runs every morning but only builds + emails when the dashboard's `asof` has
# changed since the last processed snapshot (tracked in state/last_asof.txt).
# Scheduled workflows always run on the default branch, so chart URLs
# (raw.githubusercontent.com/<repo>/<default-branch>/charts/...) resolve there.
on:
  schedule:
    - cron: "26 11 * * *"   # 11:26 UTC daily (~7am ET) — gate below skips no-new-data days
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if the data hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write   # needed to push the freshly rendered charts

concurrency:
  group: pe-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      CHART_MODE: url
      # ---- thresholds (override here or leave for sensible defaults) ----
      SINGLE_Z: "2.0"
      SINGLE_MIN_PCT: "10"
      PAIR_Z: "2.0"
      PAIR_DEV_PCT: "15"
      PAIR_IC_MIN: "0.30"
      PAIR_HIT_MIN: "60"
      # ---- email ----
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      MAIL_TO: ${{ vars.MAIL_TO }}
      MAIL_SENDER_EMAIL: ${{ vars.MAIL_SENDER_EMAIL }}
      MAIL_SENDER_NAME: ${{ vars.MAIL_SENDER_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new data
        id: check
        run: python -m pe_monitor check

      - name: Build report + charts
        if: steps.check.outputs.new_data == 'true' || inputs.force
        run: python -m pe_monitor build

      - name: Commit charts + state so URLs go live
        if: steps.check.outputs.new_data == 'true' || inputs.force
        run: |
          git config user.name  "pe-monitor-bot"
          git config user.email "actions@github.com"
          # keep only the most recent 14 days of charts to avoid bloat
          ls -1dt charts/*/ 2>/dev/null | tail -n +15 | xargs -r rm -rf
          git add charts state
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: PE monitor ${{ steps.check.outputs.asof }}"
            for i in 1 2 3 4; do git push && break || sleep $((2**i)); done
          fi

      - name: Send email
        if: steps.check.outputs.new_data == 'true' || inputs.force
        run: python -m pe_monitor send

      - name: No new data
        if: steps.check.outputs.new_data != 'true' && ! inputs.force
        run: echo "Dashboard asof unchanged (${{ steps.check.outputs.asof }}); nothing to send."
